[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dream-integrity-outcome-lens"
version = "0.2.0"
description = "Deterministic evidence-lineage and outcome-assurance tooling for public DREAM data"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Altru.dev"}]
dependencies = []

[project.scripts]
dream-lens = "dream_lens.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
